<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sakura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap">
<link rel="stylesheet" href="css/site.css?v=__CACHEBUST__">
<link rel="icon" href="logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b6d">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'"></head><body><div class="layout">
<div class="sidebar-backdrop"></div>
<nav class="sidebar" aria-label="Table index">
  <div class="brand">
    <img class="brand-mark" src="logo.png" alt="" width="32" height="32">
    <div class="brand-text">
      <h1 class="brand-title">sakura</h1>
      <span class="brand-subtitle">study</span>
    </div>
  </div>
  <a class="sidebar-overview active" href="#overview" data-page="overview">Overview</a>
  <a class="sidebar-flashcards" href="#flashcards" data-page="flashcards"><svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="11" height="8" rx="1.4"/><rect x="4.5" y="6" width="11" height="8" rx="1.4"/></svg>Flashcards</a>
  <div class="sidebar-search">
    <span class="sidebar-search-icon"><svg viewBox="0 0 18 18" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="7.5" r="4.5"/><line x1="11" y1="11" x2="15.5" y2="15.5"/></svg></span>
    <input id="sidebarSearch" type="search" aria-label="Filter tables by name" placeholder="Filter tables…" autocomplete="off">
  </div>
  <div class="sidebar-groups"></div>
  <p class="sidebar-search-empty" hidden>No tables match.</p>
</nav>
<div class="app">
<header class="site-header">
  <div class="top-row">
    <button type="button" class="sidebar-toggle" aria-label="Open table index" aria-expanded="false"><span></span></button>
    <label class="search-box">
      <span class="search-icon"><svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="7.5" r="4.5"/><line x1="11" y1="11" x2="15.5" y2="15.5"/></svg></span>
      <input id="tableSearch" type="search" aria-label="Search vocabulary" aria-controls="vocabulary" placeholder="Search Japanese, furigana, romaji or English…" autocomplete="off">
      <button type="button" class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
    </label>
  </div>
  <div class="search-meta">
    <div class="search-tools">
      <div class="view-mode" aria-label="Search scope">
        <button type="button" class="active" data-mode="all" aria-pressed="true">All</button><span aria-hidden="true">|</span>
        <button type="button" data-mode="japanese" aria-pressed="false">Japanese</button><span aria-hidden="true">|</span>
        <button type="button" data-mode="romaji" aria-pressed="false">Romaji</button><span aria-hidden="true">|</span>
        <button type="button" data-mode="english" aria-pressed="false">English</button>
      </div>
      <button type="button" class="polite-toggle" id="politeToggle" aria-pressed="false" title="Switch verb tables between the plain form and the polite 〜ます form">Show polite</button>
    </div>
    <span id="searchCount" class="search-count" role="status" aria-live="polite" aria-atomic="true"></span>
  </div>
</header>
<section id="overviewPage" class="page-overview">
  <h2>Overview</h2>
  <div class="overview-groups"></div>
</section>
<div id="vocabulary" hidden></div>
<section id="flashcardsPage" class="page-flashcards" hidden>
  <h2>Flashcards</h2>
</section>
</div>
</div>
<!--
  Classic scripts, loaded in a deliberate order. All first-party code communicates
  through one namespace, window.SakuraStudy (sub-namespaces: .data, .config,
  .shared, .vocab, .flashcards). Each file may only read namespaces populated by a
  file above it. Vendored libraries keep their own globals (window.FSRS,
  window.supabase). The ?v=__CACHEBUST__ token is stamped with the commit SHA at
  deploy time (.github/workflows/pages.yml) and matched exactly by the service
  worker's precache (sw.js).

  1. data/vocabulary.js   -> SakuraStudy.data      (vocabulary dataset, data only)
  2. js/config.js         -> SakuraStudy.config    (Supabase connection config)
  3. js/shared.js         -> SakuraStudy.shared    (cross-feature helpers)
  4. js/vocab/render.js       -> SakuraStudy.vocab  (tables / sidebar / Overview rendering, sorting)
  5. js/vocab/interactions.js -> SakuraStudy.vocab  (routing, search, view modes, menus, print, polite)
  6. vendor/ts-fsrs.js    -> window.FSRS           (vendored FSRS-6 scheduler)
  7. vendor/supabase.js   -> window.supabase       (vendored Supabase client)
  8. js/flashcards/  -> SakuraStudy.flashcards.*  (feature split by responsibility; each file
                       only reads modules above it in this list)
       store.js       .store       state & storage: local cache, guest/signed-in mode
       vocab-index.js .vocabIndex  vocab lookup + answer checking (pure)
       scheduling.js  .scheduling  FSRS-6 wrapper + review queue / stats
       data-ops.js    .dataOps     auth, Supabase sync, guest store, mode-aware ops, streak
       dashboard.js   .dashboard   Dashboard tab, review-history insights, review session flow
       views.js       .views       Manage / Settings / Help tabs + vocabulary-row toggle
       bootstrap.js   (root)       app shell, sign-in form, tab routing, DOMContentLoaded init
  9. js/sw-register.js                             (service-worker registration)
-->
<script src="data/vocabulary.js?v=__CACHEBUST__"></script>
<script src="js/config.js?v=__CACHEBUST__"></script>
<script src="js/shared.js?v=__CACHEBUST__"></script>
<script src="js/vocab/render.js?v=__CACHEBUST__"></script>
<script src="js/vocab/interactions.js?v=__CACHEBUST__"></script>
<script src="vendor/ts-fsrs.js?v=__CACHEBUST__"></script>
<script src="vendor/supabase.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/store.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/vocab-index.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/scheduling.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/data-ops.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/dashboard.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/views.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/bootstrap.js?v=__CACHEBUST__"></script>
<script src="js/sw-register.js?v=__CACHEBUST__"></script>
</body></html>
