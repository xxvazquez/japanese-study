<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sakura</title>
<script src="js/theme-init.js?v=__CACHEBUST__"></script>
<link rel="stylesheet" href="css/site.css?v=__CACHEBUST__">
<link rel="icon" href="logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f6f8">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="sakura">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'"></head><body><div class="app-frame">
<header class="masthead">
  <a class="wordmark" href="#vocabulary" data-section="vocabulary">sakura</a>
  <div class="masthead-right">
    <span class="masthead-tag">Japanese Reference</span>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Theme: System. Switch to Light." title="Theme: System">
      <svg class="theme-icon-system" viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="14" height="9.5" rx="1.2"/><path d="M6.5 15.5h5M9 12.5v3"/></svg>
      <svg class="theme-icon-dark" viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 10.2A5.8 5.8 0 0 1 7.8 3.5a5.8 5.8 0 1 0 6.7 6.7Z"/></svg>
      <svg class="theme-icon-light" viewBox="0 0 18 18" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M14.3 3.7l-1.4 1.4M5.1 12.9l-1.4 1.4"/></svg>
    </button>
  </div>
</header>
<nav class="site-nav" id="siteNav" aria-label="Sections"></nav>
<main class="app">
<section id="vocabPage" class="page page-vocab">
  <nav id="tableIndex" class="table-index" aria-label="Jump to a table"></nav>
  <div class="vocab-toolbar">
    <label class="search-box">
      <input id="tableSearch" type="search" aria-label="Search vocabulary" aria-controls="vocabulary" placeholder="Search Japanese, furigana, romaji or English…" autocomplete="off">
      <button type="button" class="clear-search" id="clearSearch" aria-label="Clear search">×</button>
    </label>
    <div class="vocab-controls">
      <div class="view-mode" aria-label="Column visibility">
        <button type="button" data-col="japanese" aria-pressed="false" title="Hide the Japanese column">Japanese</button>
        <button type="button" data-col="furigana" aria-pressed="false" title="Hide the furigana readings">Furigana</button>
        <button type="button" data-col="romaji" aria-pressed="false" title="Hide the Romaji column">Romaji</button>
        <button type="button" data-col="english" aria-pressed="false" title="Hide the English column">English</button>
      </div>
      <button type="button" class="polite-toggle" id="politeToggle" aria-pressed="false" title="Switch verb tables between the plain form and the polite 〜ます form">Show polite</button>
      <span id="searchCount" class="search-count" role="status" aria-live="polite" aria-atomic="true"></span>
    </div>
  </div>
  <div class="expand-bar"><button type="button" id="expandAllBtn" class="expand-all-btn" aria-pressed="false">Expand all</button></div>
  <div id="vocabulary"></div>
</section>
<section id="flashcardsPage" class="page page-flashcards" hidden>
  <h2>Flashcards</h2>
</section>
</main>
</div>
<!--
  Classic scripts, loaded in a deliberate order. All first-party code communicates
  through one namespace, window.SakuraStudy (sub-namespaces: .data, .config,
  .shared, .vocab, .flashcards). Each file may only read namespaces populated by a
  file above it. Vendored libraries keep their own globals (window.FSRS,
  window.supabase). The ?v=__CACHEBUST__ token is stamped with the commit SHA at
  deploy time (.github/workflows/pages.yml) and matched exactly by the service
  worker's precache (sw.js).

  js/theme-init.js is loaded first, in <head>, so the light/dark theme is on
  <html data-theme> before the first paint. Everything else loads here:

  1. data/vocabulary.js   -> SakuraStudy.data       (vocabulary dataset, data only)
  2. js/config.js         -> SakuraStudy.config     (Supabase connection config)
  3. js/shared.js         -> SakuraStudy.shared     (cross-feature helpers)
  4. js/vocab/kana-romaji.js  -> SakuraStudy.kanaRomaji (kana->romaji for the hover/tap reading layer)
  5. js/vocab/render.js       -> SakuraStudy.vocab  (tables + four-item nav rendering, sorting)
  6. js/vocab/interactions.js -> SakuraStudy.vocab  (routing, search, view modes, menus, print, polite)
  7. vendor/ts-fsrs.js    -> window.FSRS           (vendored FSRS-6 scheduler)
  8. vendor/supabase.js   -> window.supabase       (vendored Supabase client)
  9. js/flashcards/  -> SakuraStudy.flashcards.*  (feature split by responsibility; each file
                       only reads modules above it in this list)
       store.js       .store       state & storage: local cache, guest/signed-in mode
       vocab-index.js .vocabIndex  vocab lookup + answer checking (pure)
       scheduling.js  .scheduling  FSRS-6 wrapper + review queue / stats
       data-ops.js    .dataOps     auth, Supabase sync, guest store, mode-aware ops, streak
       dashboard.js   .dashboard   Dashboard tab, review-history insights, review session flow
       views.js       .views       Manage / Settings / Help tabs + vocabulary-row toggle
       bootstrap.js   (root)       app shell, sign-in form, tab routing, DOMContentLoaded init
  10. js/sw-register.js                            (service-worker registration)
-->
<script src="data/vocabulary.js?v=__CACHEBUST__"></script>
<script src="js/config.js?v=__CACHEBUST__"></script>
<script src="js/shared.js?v=__CACHEBUST__"></script>
<script src="js/vocab/kana-romaji.js?v=__CACHEBUST__"></script>
<script src="js/vocab/icons.js?v=__CACHEBUST__"></script>
<script src="js/vocab/table-custom.js?v=__CACHEBUST__"></script>
<script src="js/vocab/icon-picker.js?v=__CACHEBUST__"></script>
<script src="js/vocab/render.js?v=__CACHEBUST__"></script>
<script src="js/vocab/interactions.js?v=__CACHEBUST__"></script>
<script src="vendor/ts-fsrs.js?v=__CACHEBUST__"></script>
<script src="vendor/supabase.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/store.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/vocab-index.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/scheduling.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/data-ops.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/dashboard.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/views.js?v=__CACHEBUST__"></script>
<script src="js/flashcards/bootstrap.js?v=__CACHEBUST__"></script>
<script src="js/sw-register.js?v=__CACHEBUST__"></script>
</body></html>
